name: CI
on:
  pull_request:
  push:
jobs:
  test:
    strategy:
      matrix:
        - spark: "3.1.2"
          java-version: "11"
          distribution: "temurin"
        - spark: "3.2.2"
          java-version: "11"
          distribution: "temurin"
        - spark: "3.3.1"
          java-version: "11"
          distribution: "temurin"
        - spark: "3.4.0"
          java-version: "11"
          distribution: "temurin"
        - spark: "3.4.0"
          java-version: "17"
          distribution: "temurin"
        - spark: "4.0.0"
          java-version: "17"
          distribution: "temurin"
        - spark: "4.1.0"
          java-version: "17"
          distribution: "temurin"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: ${{ matrix.distribution }}
        cache: sbt
    - name: Add sbt
      uses: sbt/setup-sbt@v1
    - name: Cache maven modules
      id: cache-maven
      uses: actions/cache@v4
      env:
        cache-name: cache-maven
      with:
        # maven cache files are stored in `~/.m2` & `~/.ivy2` on Linux/macOS
        path: |
          ~/.m2
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: ${{ runner.os }}-${{ matrix.java-version }}-${{ matrix.spark }}-build-${{ env.cache-name }}-${{ hashFiles('build.sbt') }}
    - name: Build and Test
      run:   sbt  -DsparkVersion=${{ matrix.spark_version }} version clean test
